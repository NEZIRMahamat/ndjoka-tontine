name: ndjoka-tontine

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB doit être défini dans infra/.env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER doit être défini dans infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans infra/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres_test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: ndjoka_test
      POSTGRES_USER: ndjoka_test
      POSTGRES_PASSWORD: ndjoka_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndjoka_test -d ndjoka_test"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
