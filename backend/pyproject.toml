[project]
name = "ndjoka-tontine-backend"
version = "0.4.0"
description = "API FastAPI de la plateforme de tontine digitale Ndjoka"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19,<2.0",
    "asyncpg>=0.31,<1.0",
    "fastapi>=0.116,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "pycountry>=24.6.1,<27",
    "pyjwt[crypto]>=2.10,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12,<3.0",
    "pytest>=8.4,<10.0",
    "ruff>=0.12,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requiert le PostgreSQL local éphémère sur le port 5434",
]

[tool.ruff]
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
